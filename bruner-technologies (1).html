<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sustainable Projector — Jordan Bruner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0a0d16;
    --ink:#ffffff;
    --dim:rgba(255,255,255,0.62);
    --hair:rgba(236,227,200,0.14);

    /* fibonacci-derived spacing scale — every margin/gap on this page
       is one of these values, nothing else */
    --s1:8px; --s2:13px; --s3:21px; --s4:34px;
    --s5:55px; --s6:89px; --s7:144px; --s8:233px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100svh;
    background-color:var(--paper);
    background-image:
      radial-gradient(ellipse at 50% 30%, rgba(236,227,200,0.05), transparent 60%),
      linear-gradient(180deg, #070910 0%, #0a0d16 55%, #0c0f1a 100%);
    color:var(--ink);
    font-family:'Instrument Sans',sans-serif;
    font-weight:400;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;}
  ::selection{background:var(--ink);color:var(--paper);}

  #texture{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }

  main{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:var(--s7) var(--s6);
    min-height:100svh;
  }
  @media (max-width:760px){
    main{ padding:var(--s6) var(--s4); }
  }

  /* ---------- NAV ---------- */
  .pill-nav{
    position:fixed;
    top:var(--s4);
    left:var(--s6);
    right:var(--s6);
    z-index:6;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:transparent;
    border:1.5px solid rgba(255,255,255,0.85);
    border-radius:999px;
    padding:var(--s1) var(--s3);
  }
  @media (max-width:760px){
    .pill-nav{ left:var(--s4); right:var(--s4); }
  }
  .nav-left, .nav-right{ display:flex; gap:var(--s1); }
  .pill-nav a{
    font-size:0.86rem;
    font-weight:700;
    letter-spacing:0.03em;
    text-decoration:none;
    color:#ffffff;
    padding:var(--s1) var(--s3);
    border-radius:999px;
    transition:opacity .2s ease, background .2s ease;
    white-space:nowrap;
  }
  .pill-nav a:hover{ opacity:0.7; background:rgba(255,255,255,0.12); }
  .pill-nav a[aria-current="page"]{ background:rgba(255,255,255,0.14); }

  .idx{
    font-weight:300;
    font-size:clamp(2.4rem,6vw,3.6rem);
    color:var(--hair);
    line-height:1;
    margin-bottom:var(--s3);
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:var(--s2);
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:var(--s4);
  }
  .eyebrow::before{
    content:'';
    width:6px; height:6px;
    border-radius:50%;
    background:var(--ink);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.3; transform:scale(0.85); }
    50%{ opacity:1; transform:scale(1); }
  }

  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:300;
    font-size:clamp(2.4rem,7vw,5rem);
    letter-spacing:0.005em;
    margin-bottom:var(--s2);
  }

  .meta{
    font-size:0.82rem;
    color:var(--dim);
    letter-spacing:0.02em;
    margin-bottom:var(--s6);
  }

  a:focus-visible, button:focus-visible{
    outline:1px solid var(--ink);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<canvas id="texture" aria-hidden="true"></canvas>

<nav class="pill-nav">
  <div class="nav-left">
    <a href="portfolio-v6.html#work" aria-current="page">work</a>
    <a href="about.html">about</a>
    <a href="resume.html" target="_blank" rel="noopener">resume</a>
  </div>
  <div class="nav-right">
    <a href="contact.html">contact</a>
  </div>
</nav>

<main>
  <div class="idx">13</div>
  <div class="eyebrow">Case study in progress</div>
  <h1>Sustainable Projector</h1>
  <div class="meta">home electronics — 6th term, summer 2026</div>
</main>

<script>
(function(){
  const canvas = document.getElementById('texture');
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let w, h, dpr, stars, poleX, poleY;
  const ROTATION_PERIOD = 26 * 60 * 1000;
  const startTime = performance.now();
  const BLOOM_MS = 2800;

  function build(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w*dpr; canvas.height = h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);

    poleX = w*0.5;
    poleY = -h*0.6;

    stars = Array.from({length:140}, () => {
      const radius = Math.abs(poleY) + Math.random()*h*1.6;
      const angle = Math.random()*Math.PI*2;
      return {
        radius,
        angle,
        size: Math.random() < 0.08 ? 1.6+Math.random()*1 : 0.6+Math.random()*0.7,
        twinklePhase: Math.random()*Math.PI*2,
        twinkleSpeed: 0.0003 + Math.random()*0.0006,
        baseAlpha: 0.3 + Math.random()*0.45
      };
    });
  }
  window.addEventListener('resize', build);
  build();

  function frame(now){
    ctx.clearRect(0,0,w,h);

    const elapsed = now - startTime;
    const bloom = reduced ? 1 : Math.min(1, elapsed/BLOOM_MS);
    const bloomEase = 1 - Math.pow(1-bloom, 3);
    const rotation = reduced ? 0 : (elapsed/ROTATION_PERIOD) * Math.PI*2;

    stars.forEach(s=>{
      const a = s.angle + rotation;
      const x = poleX + Math.cos(a)*s.radius;
      const y = poleY + Math.sin(a)*s.radius;
      if(x < -10 || x > w+10 || y < -10 || y > h+10) return;

      const twinkle = reduced ? 1 : (Math.sin(now*s.twinkleSpeed + s.twinklePhase)+1)/2;
      const alpha = s.baseAlpha * (0.55 + twinkle*0.45) * bloomEase;

      ctx.beginPath();
      ctx.arc(x, y, s.size, 0, Math.PI*2);
      ctx.fillStyle = `rgba(236,227,200,${alpha.toFixed(3)})`;
      ctx.fill();
    });

    if(!reduced) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if(reduced) frame(performance.now()+BLOOM_MS+1);
})();
</script>
</body>
</html>
