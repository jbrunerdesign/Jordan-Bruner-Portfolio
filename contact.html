<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('portfolio-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Jordan Bruner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0a0d16;
    --ink:#ffffff;
    --dim:rgba(255,255,255,0.62);
    --hair:rgba(236,227,200,0.14);
    --nav-border:rgba(255,255,255,0.85);
    --nav-hover:rgba(255,255,255,0.12);
    --nav-active:rgba(255,255,255,0.14);

    /* fibonacci-derived spacing scale — every margin/gap on this page
       is one of these values, nothing else */
    --s1:8px; --s2:13px; --s3:21px; --s4:34px;
    --s5:55px; --s6:89px; --s7:144px; --s8:233px;
  }
  :root[data-theme="white"]{
    --paper:#faf9f6;
    --ink:#14161c;
    --dim:rgba(20,22,28,0.58);
    --hair:rgba(20,22,28,0.13);
    --nav-border:rgba(20,22,28,0.7);
    --nav-hover:rgba(20,22,28,0.07);
    --nav-active:rgba(20,22,28,0.1);
  }
  :root[data-theme="black"]{
    --paper:#000000;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100svh;
    background-color:var(--paper);
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(236,227,200,0.06), transparent 55%),
      linear-gradient(180deg, #070910 0%, #0a0d16 55%, #0c0f1a 100%);
    color:var(--ink);
    font-family:'Instrument Sans',sans-serif;
    font-weight:400;
    transition:background-color .3s ease, color .3s ease;
  }
  :root[data-theme="white"] body, :root[data-theme="black"] body{
    background-image:none;
  }
  a{color:inherit;}
  ::selection{background:var(--ink);color:var(--paper);}

  #texture{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  :root[data-theme="white"] #texture, :root[data-theme="black"] #texture{
    display:none;
  }

  /* ---------- THEME TOGGLE ---------- */
  .theme-toggle{
    display:flex;
    align-items:center;
    gap:var(--s2);
    margin-left:var(--s2);
    padding-left:var(--s3);
    border-left:1px solid var(--hair);
  }
  .theme-swatch{
    width:16px; height:16px; border-radius:50%; flex-shrink:0;
    padding:0; cursor:pointer;
    border:1px solid var(--hair);
    transition:border-color .2s ease, transform .2s ease, opacity .2s ease;
    opacity:0.75;
  }
  .theme-swatch:hover{ opacity:1; }
  .theme-swatch[aria-pressed="true"]{
    border-color:var(--ink);
    border-width:2px;
    transform:scale(1.15);
    opacity:1;
  }
  .theme-swatch--current{ background:linear-gradient(135deg,#0a0d16 40%,#4b3f66 75%,#e8b98a); }
  .theme-swatch--white{ background:#faf9f6; }
  .theme-swatch--black{ background:#000000; }
  .dev-serial{
    display:block;
    width:fit-content;
    margin-top:6px;
    padding:2px 7px;
    font-family:'SF Mono','Menlo',monospace;
    font-size:0.62rem;
    letter-spacing:0.03em;
    color:#39ff8f;
    background:rgba(0,0,0,0.78);
    border:1px solid rgba(57,255,143,0.4);
    border-radius:4px;
    pointer-events:none;
    user-select:none;
  }


  /* ---------- NAV ---------- */
  .pill-nav{
    position:fixed;
    top:var(--s4);
    left:var(--s6);
    right:var(--s6);
    z-index:6;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:transparent;
    border:1.5px solid var(--nav-border);
    border-radius:999px;
    padding:var(--s1) var(--s3);
    transition:opacity .3s ease, border-color .3s ease, transform .35s ease;
  }
  .pill-nav.nav-hidden{
    transform:translateY(calc(-100% - var(--s6)));
  }
  @media (max-width:760px){
    .pill-nav{ left:var(--s4); right:var(--s4); }
  }
  .nav-left, .nav-right{ display:flex; align-items:center; gap:var(--s1); }
  .pill-nav a{
    font-size:0.86rem;
    font-weight:700;
    letter-spacing:0.03em;
    text-decoration:none;
    color:var(--ink);
    padding:var(--s1) var(--s3);
    border-radius:999px;
    transition:opacity .2s ease, background .2s ease;
    white-space:nowrap;
  }
  .pill-nav a:hover{ opacity:0.7; background:var(--nav-hover); }
  @media (max-width:640px){
    .pill-nav{ padding:5px 10px; }
    .pill-nav a{ padding:4px 6px !important; font-size:0.62rem !important; letter-spacing:0 !important; }
    .nav-left, .nav-right{ gap:0px; }
    .theme-toggle{ gap:4px; margin-left:2px; padding-left:4px; }
    .theme-swatch{ width:9px; height:9px; }
  }
  .pill-nav a[aria-current="page"]{ background:var(--nav-active); }

  main{
    position:relative;
    z-index:1;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:var(--s7) var(--s6);
  }
  @media (max-width:760px){
    main{ padding:var(--s6) var(--s4); }
  }

  .contact-wrap{
    max-width:640px;
    margin:0 auto;
    width:100%;
  }

  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:var(--s3);
  }

  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:300;
    font-size:clamp(2.2rem,4.4vw,3.2rem);
    margin-bottom:var(--s3);
  }

  .intro{
    font-size:clamp(1rem,1.3vw,1.15rem);
    line-height:1.75;
    color:var(--dim);
    max-width:48ch;
    margin-bottom:var(--s7);
  }

  .contact-list{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--hair);
  }

  .contact-item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:var(--s4);
    padding:var(--s5) 0;
    border-bottom:1px solid var(--hair);
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .contact-item:hover{ opacity:0.6; }

  .contact-label{
    font-size:0.72rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--dim);
    white-space:nowrap;
  }

  .contact-value{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:300;
    font-size:clamp(1.1rem,2.2vw,1.5rem);
    text-align:right;
  }

  a:focus-visible, button:focus-visible{
    outline:1px solid var(--ink);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<canvas id="texture" aria-hidden="true"></canvas>

<nav class="pill-nav">
  <div class="nav-left">
    <a href="index.html#work">work</a>
    <a href="about.html">about</a>
    <a href="resume.html" target="_blank" rel="noopener">resume</a>
  </div>
  <div class="nav-right">
    <a href="contact.html" aria-current="page">contact</a>
    <div class="theme-toggle" data-theme-toggle role="group" aria-label="Background theme">
      <button type="button" class="theme-swatch theme-swatch--current" data-theme-set="" aria-label="Current theme"></button>
      <button type="button" class="theme-swatch theme-swatch--white" data-theme-set="white" aria-label="White theme"></button>
      <button type="button" class="theme-swatch theme-swatch--black" data-theme-set="black" aria-label="Black theme"></button>
    </div>
  </div>
</nav>

<main>
  <div class="contact-wrap">
    <div class="eyebrow">Get in touch</div>
    <h1>Contact</h1>
    <p class="intro">Open to new projects, collaborations, and conversations about design. Reach me through any of the below.</p>

    <div class="contact-list">
      <a class="contact-item" href="mailto:jbruner.design@gmail.com">
        <span class="contact-label">Email</span>
        <span class="contact-value">jbruner.design@gmail.com</span>
      </a>
      <a class="contact-item" href="https://linkedin.com/in/jordan-bruner-045874307" target="_blank" rel="noopener">
        <span class="contact-label">LinkedIn</span>
        <span class="contact-value">jordan-bruner-045874307</span>
      </a>
      <a class="contact-item" href="https://www.instagram.com/jordanb.design" target="_blank" rel="noopener">
        <span class="contact-label">Instagram</span>
        <span class="contact-value">@jordanb.design</span>
      </a>
    </div>
  </div>
</main>

<script>
(function(){
  const canvas = document.getElementById('texture');
  const ctx = canvas.getContext('2d');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let w, h, dpr, stars, poleX, poleY;
  const ROTATION_PERIOD = 26 * 60 * 1000;
  const startTime = performance.now();
  const BLOOM_MS = 2800;

  function build(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w*dpr; canvas.height = h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);

    poleX = w*0.5;
    poleY = -h*0.6;

    stars = Array.from({length:140}, () => {
      const radius = Math.abs(poleY) + Math.random()*h*1.6;
      const angle = Math.random()*Math.PI*2;
      return {
        radius,
        angle,
        size: Math.random() < 0.08 ? 1.6+Math.random()*1 : 0.6+Math.random()*0.7,
        twinklePhase: Math.random()*Math.PI*2,
        twinkleSpeed: 0.0003 + Math.random()*0.0006,
        baseAlpha: 0.3 + Math.random()*0.45
      };
    });
  }
  window.addEventListener('resize', build);
  build();

  function frame(now){
    ctx.clearRect(0,0,w,h);

    const elapsed = now - startTime;
    const bloom = reduced ? 1 : Math.min(1, elapsed/BLOOM_MS);
    const bloomEase = 1 - Math.pow(1-bloom, 3);
    const rotation = reduced ? 0 : (elapsed/ROTATION_PERIOD) * Math.PI*2;

    stars.forEach(s=>{
      const a = s.angle + rotation;
      const x = poleX + Math.cos(a)*s.radius;
      const y = poleY + Math.sin(a)*s.radius;
      if(x < -10 || x > w+10 || y < -10 || y > h+10) return;

      const twinkle = reduced ? 1 : (Math.sin(now*s.twinkleSpeed + s.twinklePhase)+1)/2;
      const alpha = s.baseAlpha * (0.55 + twinkle*0.45) * bloomEase;

      ctx.beginPath();
      ctx.arc(x, y, s.size, 0, Math.PI*2);
      ctx.fillStyle = `rgba(236,227,200,${alpha.toFixed(3)})`;
      ctx.fill();
    });

    if(!reduced) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if(reduced) frame(performance.now()+BLOOM_MS+1);
})();
</script>

<script>
(function(){
  const KEY = 'portfolio-theme';
  const root = document.documentElement;
  const toggle = document.querySelector('[data-theme-toggle]');
  if(!toggle) return;
  const buttons = [...toggle.querySelectorAll('[data-theme-set]')];

  function sync(){
    const current = root.getAttribute('data-theme') || '';
    buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === current)));
  }
  sync();

  buttons.forEach(b => {
    b.addEventListener('click', () => {
      const theme = b.dataset.themeSet;
      if(theme){ root.setAttribute('data-theme', theme); }
      else{ root.removeAttribute('data-theme'); }
      try{ localStorage.setItem(KEY, theme); }catch(e){}
      sync();
    });
  });
})();
</script>
<script>
(function(){
  const nav = document.querySelector('.pill-nav');
  if(!nav) return;
  let lastY = window.scrollY;
  let ticking = false;

  function onScroll(){
    const y = window.scrollY;
    if(y > lastY && y > 80){
      nav.classList.add('nav-hidden');
    } else {
      nav.classList.remove('nav-hidden');
    }
    lastY = y;
    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if(!ticking){
      window.requestAnimationFrame(onScroll);
      ticking = true;
    }
  }, {passive:true});
})();
</script>
<script>
(function(){
  const PAGE_CODE = 'CONTACT';
  const KEY = 'portfolio-devmode';

  function clearLabels(){
    document.querySelectorAll('.dev-serial').forEach(el => el.remove());
  }

  function labelImages(){
    clearLabels();
    document.querySelectorAll('img:not(#lightbox-img)').forEach((img, i) => {
      const label = document.createElement('div');
      label.className = 'dev-serial';
      label.textContent = PAGE_CODE + '-' + String(i + 1).padStart(2, '0');
      img.insertAdjacentElement('afterend', label);
    });
  }

  function applyState(){
    let on = false;
    try{ on = localStorage.getItem(KEY) === '1'; }catch(e){}
    if(on){ labelImages(); } else { clearLabels(); }
  }
  applyState();

  const trigger = document.getElementById('dev-trigger');
  if(trigger){
    trigger.addEventListener('click', () => {
      let on = false;
      try{ on = localStorage.getItem(KEY) === '1'; }catch(e){}
      try{
        if(on){ localStorage.removeItem(KEY); } else { localStorage.setItem(KEY, '1'); }
      }catch(e){}
      applyState();
    });
  }
})();
</script>
</body>
